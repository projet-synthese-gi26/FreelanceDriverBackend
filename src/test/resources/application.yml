spring:
  config:
    activate:
      on-profile: test
  
  # Pour les tests, on évite R2DBC/Postgres et on désactive l'init SQL
  # ou on configure une base H2 si disponible (mais r2dbc-h2 n'est peut-être pas dans le pom)
  # Le plus simple pour 'contextLoads' est de désactiver ce qui échoue.
  sql:
    init:
      mode: never
  
  docker:
    compose:
      enabled: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration
      - org.springframework.boot.autoconfigure.data.r2dbc.R2dbcDataAutoConfiguration
  
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/.well-known/jwks.json

application:
  external:
    auth-service-url: http://localhost:8081
    organization-service-url: http://localhost:8082
    stock-service-url: http://localhost:8083
  kafka:
    topics:
      product-events: test-topic


