server:
  port: 8081

# Config Swagger
app:
  swagger:
    server-url: ${FREELANCE_DRIVER_SERVER_URL:https://traefikdev.yowyob.com/freelance-driver}

spring:
  application:
    name: freelance-driver
    
  docker:
    compose:
      enabled: false

  # POSTGRESQL (R2DBC)
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:reactivedb}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
    pool:
      enabled: true
      initial-size: 0
      max-size: 5
      max-idle-time: 30m
      max-life-time: 10m
      acquire-retry: 3
      max-acquire-time: 30s
      validation-query: SELECT 1
  
  # LIQUIBASE
  liquibase:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:reactivedb}
    user: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  sql:
    init:
      mode: never

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:mbognengj@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:msyyjlvcufflpqel}
    properties:
      mail.smtp.auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
      mail.smtp.starttls.required: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:true}
      mail.debug: ${SPRING_MAIL_PROPERTIES_MAIL_DEBUG:true}

  # REDIS CLUSTER 
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:7000}
      password: ${REDIS_PASSWORD:password}
      cluster:
        enabled: false

  # KAFKA (désactivé)
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      missing-topics-fatal: false

  # SECURITY
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:https://traefikdev.yowyob.com/auth/.well-known/jwks.json}
          jws-algorithms: RS256

# CUSTOM CONFIG 
application:
  external:
    auth-service-url: ${AUTH_SERVICE_URL:https://traefikdev.yowyob.com/auth}
    payment-service-url: ${PAYMENT_SERVICE_URL:https://payment-service.pynfi.com}
    organization-service-url: ${ORGANIZATION_SERVICE_URL:https://traefikdev.yowyob.com/organization}
    vehicle-service-url: ${VEHICLE_SERVICE_URL:https://traefikdev.yowyob.com/vehicule}
    #vehicle-service-url: ${VEHICLE_SERVICE_URL:http://localhost:8080}
    stock-service-url: http://${EXTERNAL_HOST:localhost}:8081
    notification-service-url: ${NOTIFICATION_SERVICE_URL:https://traefikdev.yowyob.com/notification}
    notification-service-token: ${NOTIFICATION_SERVICE_TOKEN:}
  kafka:
    enabled: false
    topics:
      product-events: product-events-topic
  notification:
    templates:
      pull:
        planning-requested: ${NOTIF_TPL_PULL_PLANNING_REQUESTED:}
        planning-accepted: ${NOTIF_TPL_PULL_PLANNING_ACCEPTED:}
        planning-confirmed: ${NOTIF_TPL_PULL_PLANNING_CONFIRMED:}
        annonce-accepted: ${NOTIF_TPL_PULL_ANNONCE_ACCEPTED:}
        annonce-confirmed: ${NOTIF_TPL_PULL_ANNONCE_CONFIRMED:}
        review-received: ${NOTIF_TPL_PULL_REVIEW_RECEIVED:}
      push:
        planning-requested: ${NOTIF_TPL_PUSH_PLANNING_REQUESTED:}
        planning-accepted: ${NOTIF_TPL_PUSH_PLANNING_ACCEPTED:}
        planning-confirmed: ${NOTIF_TPL_PUSH_PLANNING_CONFIRMED:}
        annonce-accepted: ${NOTIF_TPL_PUSH_ANNONCE_ACCEPTED:}
        annonce-confirmed: ${NOTIF_TPL_PUSH_ANNONCE_CONFIRMED:}
        review-received: ${NOTIF_TPL_PUSH_REVIEW_RECEIVED:}

management:
  endpoints:
    web:
      exposure:
        include: ["health","info","prometheus"]
  endpoint:
    health:
      show-details: "always"
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
    org.springframework.web.reactive.function.client.WebClient: DEBUG

# RESILIENCE4J 
resilience4j:
  circuitbreaker:
    instances:
      stock-service:
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        slidingWindowSize: 5
