server:
  port: 8080  # Port pour le service

spring:
  application:
    name: freelance-driver  # Nom de l'application
  docker:
    compose:
      enabled: false  # Désactiver Docker Compose

  # ------------------------------------------------------------------
  # DATABASE — Liquibase
  # ------------------------------------------------------------------
  liquibase:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:yowyob}
    user: ${DB_LIQUIBASE_USERNAME}
    password: ${DB_LIQUIBASE_PASSWORD}
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: ${DB_SCHEMA:freelance_driver}
    liquibase-schema: ${DB_SCHEMA:freelance_driver}

  # Configuration de la base de données PostgreSQL (R2DBC)
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:yowyob}?schema=${DB_SCHEMA:freelance_driver}  # Utilisation des variables d'environnement pour l'URL
    username: ${DB_USERNAME:postgres}  # Nom d'utilisateur de la base de données
    password: ${DB_PASSWORD:password}  # Mot de passe de la base de données
    pool:
      enabled: true
      initial-size: 1
      max-size: 5
      max-idle-time: 30m
      max-life-time: 10m
      acquire-retry: 3
      max-acquire-time: 30s
      validation-query: SELECT 1  # Requête de validation de la connexion

  sql:
    init:
      mode: never

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:mbognengj@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:fmpjyadvpepfvcws}
    properties:
      mail.smtp.auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
      mail.smtp.starttls.required: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:true}
      mail.debug: ${SPRING_MAIL_PROPERTIES_MAIL_DEBUG:true}

  # ------------------------------------------------------------------
  # REDIS CLUSTER
  # ------------------------------------------------------------------
  data:
    redis:
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      cluster:
        nodes:
          - ${REDIS_HOST}:7001
          - ${REDIS_HOST}:7002
          - ${REDIS_HOST}:7003
          - ${REDIS_HOST}:7004
          - ${REDIS_HOST}:7005
          - ${REDIS_HOST}:7006
        max-redirects: 3
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
        cluster:
          refresh:
            adaptive: true
            period: 30s
            dynamic-refresh-sources: false

  # ------------------------------------------------------------------
  # KAFKA — Connexion sécurisée SASL/SCRAM-SHA-256
  # ------------------------------------------------------------------
  kafka:
    bootstrap-servers: ${KAFKA_HOST}:${KAFKA_PORT:29092}

    # ── Authentification SASL/SCRAM-SHA-256 ────────────────────────
    properties:
      security.protocol: SASL_PLAINTEXT
      sasl.mechanism: SCRAM-SHA-256
      sasl.jaas.config: >
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="${KAFKA_BACKEND_USER}"
        password="${KAFKA_BACKEND_PASSWORD}";
    consumer:
      auto-offset-reset: earliest  # Réinitialiser l'offset au début en cas d'absence
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer  # Désérialiseur de clé (String)
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer  # Désérialiseur de valeur (JSON)
      properties:
        spring.json.trusted.packages: "*"  # Autoriser tous les packages pour la désérialisation JSON
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer  # Sérialiseur de clé (String)
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer  # Sérialiseur de valeur (JSON)

  # Configuration de la sécurité (OAuth2 Resource Server)
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:https://traefikdev.yowyob.com/auth/.well-known/jwks.json}  # URL du JWK Set

# CONFIGURATION PERSONNALISÉE
application:
  external:
    auth-service-url: ${AUTH_SERVICE_URL:https://traefikdev.yowyob.com/auth}  # URL du service d'authentification (variable d'environnement)
    organization-service-url: ${ORGANIZATION_SERVICE_URL:https://traefikdev.yowyob.com/organization}  # URL du service Organisation
    stock-service-url: http://${EXTERNAL_HOST:localhost}:8081  # URL du service Stock
    vehicle-service-url: ${VEHICLE_SERVICE_URL:https://traefikdev.yowyob.com/vehicule}
    notification-service-url: ${NOTIFICATION_SERVICE_URL:https://traefikdev.yowyob.com/notification}
    notification-service-token: ${NOTIFICATION_SERVICE_TOKEN}

  kafka:
    topics:
      product-events: test-topic  # Topic Kafka pour les événements de produit

# CONFIGURATION DES ENDPOINTS DE GESTION (Actuator)
management:
  endpoints:
    web:
      exposure:
        include: ["health", "info", "prometheus"]  # Activer les endpoints d'Actuator
  endpoint:
    health:
      show-details: "always"  # Afficher les détails de l'état de santé
      probes:
        enabled: true  # Activer les sondes de santé (probes)
  metrics:
    export:
      prometheus:
        enabled: true  # Exporter les métriques Prometheus

# CONFIGURATION DE RESILIENCE4J (Circuit Breaker)
resilience4j:
  circuitbreaker:
    instances:
      stock-service:
        failureRateThreshold: 50  # Seuil de taux d'échec pour ouvrir le circuit (50%)
        waitDurationInOpenState: 5s  # Durée d'attente avant de tenter une nouvelle requête (5 secondes)
        slidingWindowSize: 5  # Nombre de requêtes dans la fenêtre glissante
