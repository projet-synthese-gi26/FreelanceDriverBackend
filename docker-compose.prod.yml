version: "3.8"
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:8081"  # Exposition du port pour l'application backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Configuration spécifique à la production. Remplacez les valeurs par vos configurations
      DB_HOST: postgres  # Utilisation du nom du service pour la communication interne
      DB_PORT: 5432
      DB_NAME: reactivedb
      DB_USERNAME: user
      DB_PASSWORD: password
      REDIS_HOST: redis  # Utilisation du nom du service pour la communication interne
      REDIS_PORT: 6379
      REDIS_PASSWORD: password
      KAFKA_HOST: kafka  # Utilisation du nom du service pour la communication interne
      KAFKA_PORT: 9092
      # ... autres variables d'environnement spécifiques à la prod...
    depends_on:
      - postgres
      - redis
      - kafka

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: reactivedb
    ports:
      - "5432:5432"  # Le port 5432 est exposé, mais uniquement pour l'accès depuis le Droplet
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379" # Le port 6379 est exposé, mais uniquement pour l'accès depuis le Droplet
  #kafka:
    #image: bitnami/kafka:3.6.2
    #ports:
    #  - "9092:9092"
    #environment:
      #- KAFKA_CFG_NODE_ID=0
      #- KAFKA_CFG_PROCESS_ROLES=controller,broker
      #- KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      #- KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      #- KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      #- KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      #- KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

  stock-mock: # Vous pouvez commenter cette partie, vous n'en aurez pas besoin en production, mais laissez la pour ne pas avoir à modifier les configurations.
    image: wiremock/wiremock:2.35.0
    ports:
      - "8081:8080"
    command:
      - "--root-dir"
      - "/home/wiremock"
      - "--verbose"
      - "--global-response-templating"
    volumes:
      - ./wiremock:/home/wiremock

volumes:
  postgres_data: