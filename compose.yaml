services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: reactivedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  #kafka:
    #image: bitnami/kafka:3.6.2
    #ports:
    #  - "9092:9092"
    #environment:
      #- KAFKA_CFG_NODE_ID=0
      #- KAFKA_CFG_PROCESS_ROLES=controller,broker
      #- KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      #- KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      #- KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      #- KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      #- KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      # Zookeeper écoute sur le port 2181 pour les ordres
      ZOOKEEPER_CLIENT_PORT: 2181

  # ÉTAPE 2 : On lance le Travailleur
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    #  Kafka ne démarrera pas TANT QUE Zookeeper n'est pas prêt
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

  # Stock service Mock
  stock-mock:
    image: wiremock/wiremock:2.35.0
    ports:
      - "8081:8080"

    
    # start the wiremock
    command:
      - "--root-dir"
      - "/home/wiremock" # On lui dit où sont ses fichiers
      - "--verbose"
      - "--global-response-templating"
    volumes:
      # Cette ligne est correcte, elle met bien nos fichiers au bon endroit
      - ./wiremock:/home/wiremock

volumes:
  postgres_data: